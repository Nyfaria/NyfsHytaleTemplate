plugins {
    id 'java'
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'hytale-mod' version '0.+'
}

ext {
    hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

hytale {
    updateChannel = patchline
}

repositories {
    mavenCentral()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

def serverJar = file("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar")
def serverSrcZip = file("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer-sources.jar")

gradle.projectsEvaluated {
    if (serverJar.exists() && (!serverSrcZip.exists() || serverJar.lastModified() > serverSrcZip.lastModified())) {
        gradle.startParameter.taskNames = ['decompileServer'] + gradle.startParameter.taskNames
    }
}

dependencies {
    implementation files(serverJar)
}


processResources {
    def expandProps = [
            "version"                      : version,
            "mod_id"                       : mod_id,
            "mod_name"                     : mod_name,
            "description"                  : description,
            "author"                       : author,
            "website"                      : website
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}


def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

def findHytalePluginClass = {
    def sourceDir = file('src/main/java')
    def annotatedClasses = []

    if (sourceDir.exists()) {
        sourceDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (file.name.endsWith('.java')) {
                def content = file.text
                if (content.contains('@HytalePlugin')) {
                    def packageMatcher = content =~ /package\s+([\w.]+)\s*;/
                    def packageName = packageMatcher ? packageMatcher[0][1] : ''
                    def classMatcher = content =~ /@HytalePlugin\s*\n?\s*public\s+class\s+(\w+)/
                    if (classMatcher) {
                        def className = classMatcher[0][1]
                        def fqcn = packageName ? "${packageName}.${className}" : className
                        annotatedClasses << fqcn
                    }
                }
            }
        }
    }

    if (annotatedClasses.isEmpty()) {
        throw new GradleException("No class found with @HytalePlugin annotation!")
    }

    if (annotatedClasses.size() > 1) {
        throw new GradleException("Only one @HytalePlugin is allowed, Classes Found: ${annotatedClasses.join(', ')}.")
    }

    return annotatedClasses.first()
}

tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }

        def mainClass = findHytalePluginClass()
        logger.lifecycle("Found @HytalePlugin annotated class: ${mainClass}")

        def manifestJson = new groovy.json.JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestJson.Main = mainClass
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifestJson))
    }
}

tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}